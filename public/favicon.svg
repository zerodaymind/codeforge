<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cf-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cf-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Base with High-Contrast Border -->
  <rect width="64" height="64" rx="14" fill="url(#cf-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Code Bracket Chevron: < -->
  <path
    d="M 23 18 L 11 32 L 23 46"
    fill="none"
    stroke="url(#cf-cyan)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cf-glow)"
  />

  <!-- Forge Monogram Bar: F -->
  <!-- Vertical Spine -->
  <path
    d="M 31 18 L 31 46"
    fill="none"
    stroke="url(#cf-violet)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Top Horizontal Bar -->
  <path
    d="M 31 18 L 47 18"
    fill="none"
    stroke="url(#cf-violet)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Mid Horizontal Bar -->
  <path
    d="M 31 31 L 43 31"
    fill="none"
    stroke="url(#cf-violet)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Forge Spark: ✦ -->
  <path
    d="M 52 10 C 52 14.5 54.5 16.5 59 16.5 C 54.5 16.5 52 18.5 52 23 C 52 18.5 49.5 16.5 45 16.5 C 49.5 16.5 52 14.5 52 10 Z"
    fill="#fbbf24"
  />
</svg>